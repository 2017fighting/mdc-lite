# The narrowed pipeline: the same chain, with `required_fields` cut to `["title"]`.
#
# It runs over `IPX-535`, a release only javbus has a capture for. The task ends
# `partial`, not `succeeded` — the point of the arm. `required_fields` decides
# failed-or-not at the gate; `Missing` (the 14 source-level fields) decides
# partial-or-succeeded. Narrowing the gate cannot manufacture a `succeeded` task, and
# the acceptance README says so instead of pretending otherwise.
name: acceptance-lenient

steps:
  - type: scan
    with:
      roots: ["${MDC_ACCEPT_ROOT}/library-in"]
      exclude: []

  - type: filter
    with:
      rules:
        - name: companions
          when: {ext_in: [".srt", ".ass", ".ssa", ".jpg", ".jpeg", ".png"]}
          then: include
        - name: too-small
          # Explicitly zero: this corpus is one-second clips (requirement, and the
          # reason is above).
          when: {min_size: 0}
          then: exclude
        - name: videos
          when: {ext_in: [".mp4", ".mkv", ".avi", ".mov", ".m4v"]}
          then: include
        - name: everything-else
          when: {stem_matches: "^.*$"}
          then: exclude

  - type: parse
    with:
      rules:
        - {builtin: default}

  - type: group
    with:
      companion_extensions: [".srt", ".ass", ".ssa", ".jpg", ".jpeg", ".png"]

  - type: scrape
    with:
      # Every source replays from committed captures. The per-source rate is raised
      # because the replay answers instantly and a 1 req/s bucket would turn a four
      # and a half task run into a minute of waiting for no added coverage.
      sources:
        - id: javdb
          # `cooldown` is 1 ms, not the 5 min default: `FAIL-COOL` replays a 503, and a
          # real cool-down would make the *other* numbers' javdb answers `cooldown` too.
          # The reason code under test is the 503's own, not the limiter's.
          rate: {requests_per_second: 50, burst: 20, cooldown: 1ms}
        - id: javbus
          # The per-request timeout is short so `FAIL-SLOW` (a site that answers after
          # several seconds) becomes `timeout` in a second rather than in thirty. The
          # replay answers everything else instantly.
          rate: {requests_per_second: 50, burst: 20, cooldown: 1s}
          timeout: 1s
        - id: fc2
          # Third because the replay needs it: `FC2-PPV-1234567` is the captured 200
          # miss page, and a source that is not in the list is never asked.
          rate: {requests_per_second: 50, burst: 20, cooldown: 1s}
      timeout: 2m

  - type: images
    with: {}

  - type: nfo
    with:
      template: default

  - type: output
    with:
      root: "${MDC_ACCEPT_ROOT}/library"
      dir_template: "{{ number }}"
      file_template: "{{ number }}{% if part %}-cd{{ part }}{% endif %}{{ version }}"
      link: hardlink
      required_fields: ["title"]
