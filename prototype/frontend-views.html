<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers one question: 三视图（扫描预览 / 任务列表 / 任务详情）长什么样。
  不是产品代码：没有构建、没有依赖、没有测试、假数据在内存里。
  打开方式：浏览器直接打开本文件（file:// 也能用），或 `python3 -m http.server` 后访问。
  URL 参数：?variant=A|B|C&view=scan|tasks|detail|numbers&state=normal|loading|empty|error
  底部的浮动条是原型专用的（生产里会按 NODE_ENV 关掉）。
  结构取向：A 密集表格运维台 / B 海报卡片墙 / C 深色流程看板 —— 三者结构不同，不是换配色。

  【已裁决，见 issue #11 结票评论】基线 = 变体 A（运维台表格）；扫描预览跑到 `--until parse`（修正 #2）；
  图片走 API 缩放端点（视频不抽帧）；生产样式 = Tailwind v4（本文件手写 CSS 只是为了让原型无构建即开）；
  分页 = 页码 + 每页；搜索只搜番号；批量只做重跑；批次只做筛选项；详情页不放日志（只用 step_runs/source_runs）；
  填号两处都能填（待补号页 + 详情页）；「打开输出目录」= 复制路径 + 落盘台账；默认排序 = 创建时间倒序。

  【补充裁决·目录选择】产品跑在容器里，所以根目录/排除都是**容器内**目录选择器：
  弹窗式浏览器（面包屑 + 子目录列表 + 手输路径 + 「设为根目录」/「加入排除」两个动作）；
  可浏览范围 = 进程级 `browse_roots` 白名单（默认 `["/media"]`，修正 #8 配置面），越界即报错；
  路径展示 = 容器内绝对路径 + 挂载点标签，不做宿主路径映射；不做浏览器本地目录拖放。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdc-lite 三视图原型</title>
<style>
/* ---------- 共享基础 ---------- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
a{cursor:pointer;text-decoration:none}
#app{min-height:100%;display:flex;flex-direction:column}
.ph{display:block;background-size:cover;background-position:center;background-color:#2a2f38}
.sk{background:linear-gradient(90deg,#e9ecf1 25%,#f4f6f9 37%,#e9ecf1 63%);background-size:400% 100%;
  animation:sk 1.2s ease-in-out infinite;border-radius:4px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- 状态色（三变体共用语义） ---------- */
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.st.s-queued i{background:#94a3b8}.st.s-queued{color:#64748b}
.st.s-running i{background:#2563eb}.st.s-running{color:#2563eb}
.st.s-succeeded i{background:#16a34a}.st.s-succeeded{color:#15803d}
.st.s-partial i{background:#d97706}.st.s-partial{color:#b45309}
.st.s-failed i{background:#dc2626}.st.s-failed{color:#b91c1c}
.st.s-needs_number i{background:#7c3aed}.st.s-needs_number{color:#6d28d9}
.st.s-cancelled i{background:#9ca3af}.st.s-cancelled{color:#6b7280}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- 浮动原型控制条 ---------- */
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:999;
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:999px;
  background:#11151b;color:#e6edf3;box-shadow:0 8px 28px rgba(0,0,0,.42);border:1px solid #2b333d;
  font-size:12px;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
#bar .seg{display:flex;align-items:center;gap:4px;background:#1b212a;border-radius:999px;padding:3px}
#bar button{background:transparent;border:0;color:#c3ccd7;padding:3px 9px;border-radius:999px;font-size:12px}
#bar button.on{background:#3b82f6;color:#fff}
#bar .arrow{font-size:14px;padding:3px 8px}
#bar .lbl{min-width:112px;text-align:center;font-weight:600;color:#fff}
#bar .sep{width:1px;height:20px;background:#2b333d}
#bar .tag{color:#7d8894;letter-spacing:.08em;font-size:10px;text-transform:uppercase}

/* ================= A · 运维台（密集表格 + 左侧导航） ================= */
.vA{--bg:#f5f6f8;--panel:#fff;--line:#e2e6ec;--text:#161a1f;--muted:#6b7280;--accent:#2f6fed;
  background:var(--bg);color:var(--text)}
.vA .top{display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
.vA .brand{font-weight:700;letter-spacing:-.01em}
.vA .brand span{color:var(--accent)}
.vA .top select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
.vA .grow{flex:1}
.vA .tagline{color:var(--muted);font-size:12px}
.vA .layout{display:flex;flex:1;min-height:0}
.vA .side{width:186px;flex:0 0 186px;background:#fff;border-right:1px solid var(--line);padding:10px 8px}
.vA .side a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:#374151;font-size:13px}
.vA .side a:hover{background:#f1f3f7}
.vA .side a.on{background:#eaf0fe;color:#1d4ed8;font-weight:600}
.vA .side a.dim{color:#9aa2ad}
.vA .side .n{margin-left:auto;background:#eef1f5;color:#5b6472;border-radius:9px;padding:0 6px;font-size:11px}
.vA .side .n.warn{background:#f3ecfe;color:#6d28d9}
.vA .side .sec{color:#98a1ac;font-size:11px;padding:12px 10px 4px;letter-spacing:.04em}
.vA main{flex:1;min-width:0;padding:16px 18px 96px;overflow:auto}
.vA h1{font-size:16px;margin:0 0 2px}
.vA .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.vA .card{background:#fff;border:1px solid var(--line);border-radius:8px}
.vA table{width:100%;border-collapse:collapse;font-size:12.5px}
.vA th{text-align:left;font-weight:600;color:#5b6472;background:#fafbfc;border-bottom:1px solid var(--line);
  padding:7px 9px;white-space:nowrap;font-size:11.5px}
.vA td{padding:6px 9px;border-bottom:1px solid #eef1f5;vertical-align:middle}
.vA tbody tr:hover{background:#fafcff}
.vA tbody tr.sel{background:#f2f7ff}
.vA .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.vA .chips{display:flex;gap:4px;flex-wrap:wrap}
.vA .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;color:#4b5563;font-size:12px}
.vA .chip.on{background:#111827;color:#fff;border-color:#111827}
.vA input[type=search],.vA input[type=text]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
.vA .btn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 11px;color:#374151}
.vA .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.vA .btn.pri[disabled]{background:#c7d3ea;border-color:#c7d3ea;cursor:not-allowed}
.vA .btn.sm{padding:2px 7px;font-size:11.5px}
.vA .pg{display:flex;align-items:center;gap:6px;padding:9px;color:var(--muted);font-size:12px}
.vA .pg .pn{border:1px solid var(--line);border-radius:5px;background:#fff;min-width:26px;padding:2px 0;text-align:center}
.vA .pg .pn.on{background:#111827;color:#fff;border-color:#111827}
.vA .thumb{width:30px;height:42px;border-radius:3px}
.vA .ico{width:26px;height:26px;border-radius:4px;display:grid;place-items:center;background:#eef1f5;color:#5b6472;font-size:11px}
.vA .muted{color:var(--muted)}
.vA .pill{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;background:#eef1f5;color:#4b5563}
.vA .pill.v{background:#f3ecfe;color:#6d28d9}
.vA .pill.r{background:#fdeaea;color:#b91c1c}
.vA .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vA .field{display:grid;grid-template-columns:132px 1fr 92px;gap:8px;padding:6px 9px;border-bottom:1px solid #eef1f5;font-size:12.5px}
.vA .field .k{color:#5b6472}
.vA .field .v{min-width:0;overflow-wrap:anywhere}
.vA .field .s{color:#94a3b8;font-size:11.5px;text-align:right}
.vA .field.miss .v{color:#b91c1c}
.vA .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 0}
.vA .tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:7px 11px;color:#5b6472}
.vA .tabs button.on{color:#1d4ed8;border-bottom-color:var(--accent);font-weight:600}
.vA .head{display:flex;gap:14px;align-items:flex-start}
.vA .head .poster{width:96px;height:144px;border-radius:6px;flex:0 0 auto}
.vA .strip{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.vA .strip .f16{width:150px;height:84px;border-radius:4px;flex:0 0 auto}
.vA .bar16{width:100%;aspect-ratio:16/9;border-radius:6px}
.vA .stickybar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px;
  display:flex;align-items:center;gap:12px;border-radius:0 0 8px 8px}
.vA .prog{display:flex;gap:10px;align-items:center;color:#4b5563;font-size:12px;padding:10px 12px;border-bottom:1px solid #eef1f5}
.vA .prog .done{color:#15803d}
.vA .prog .now{color:#1d4ed8;font-weight:600}
.vA .empty{padding:44px;text-align:center;color:var(--muted)}
.vA .empty .big{font-size:15px;color:#374151;margin-bottom:4px}
.vA .err{background:#fdeaea;border:1px solid #f6c9c9;color:#8f1d1d;padding:10px 12px;border-radius:8px;
  display:flex;gap:10px;align-items:center;margin-bottom:10px}
.vA .grp td:first-child{border-left:2px solid transparent}
.vA .grp.primary td{background:#fbfdff}
.vA .part td:first-child{padding-left:26px}
.vA .numin{border:1px solid #cbd5e1;border-radius:5px;padding:3px 6px;width:118px;font-family:ui-monospace,monospace}
.vA .cand{display:inline-flex;gap:4px}
.vA .cand button{border:1px solid #ddd6fe;background:#f7f4ff;color:#6d28d9;border-radius:5px;padding:1px 7px;font-size:11.5px}
.vA .cand button.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.vA .fillrow{display:grid;grid-template-columns:1fr 220px 170px 168px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eef1f5}
#lb{position:fixed;inset:0;background:rgba(8,10,14,.93);display:none;place-items:center;z-index:1000;padding:36px;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:92vw;max-height:84vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lb .hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#9aa4b0;font-size:12px}
/* 容器内目录选择器（弹窗） */
.modal{position:fixed;inset:0;background:rgba(10,12,16,.55);display:grid;place-items:center;z-index:1100;padding:24px}
.modal .box{width:min(620px,94vw);background:#fff;color:#161a1f;border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);overflow:hidden}
.modal h3{margin:0;padding:12px 14px;border-bottom:1px solid #e6e9ee;font-size:14px}
.modal .crumb{padding:9px 14px;border-bottom:1px solid #eef1f5;display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.modal .crumb a{color:#2f6fed}
.modal .crumb .sep{color:#c3c9d2}
.modal .jump{display:flex;gap:8px;padding:9px 14px;border-bottom:1px solid #eef1f5}
.modal .jump input{flex:1;border:1px solid #dfe3e9;border-radius:7px;padding:6px 9px;font-family:ui-monospace,monospace;font-size:12.5px}
.modal .list{max-height:300px;overflow:auto;padding:6px 8px}
.modal .item{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer}
.modal .item:hover{background:#f4f7fc}
.modal .item .n{flex:1;font-family:ui-monospace,monospace;font-size:12.5px}
.modal .item .c{color:#8b95a3;font-size:11.5px}
.modal .foot{display:flex;gap:8px;align-items:center;padding:11px 14px;border-top:1px solid #e6e9ee;background:#fafbfc}
.modal .foot .btn{border:1px solid #dfe3e9;background:#fff;border-radius:7px;padding:5px 12px;color:#374151}
.modal .foot .btn.pri{background:#2f6fed;border-color:#2f6fed;color:#fff;font-weight:600}
.modal .err{margin:0 14px 8px;background:#fdeaea;color:#8f1d1d;border:1px solid #f6c9c9;border-radius:7px;padding:7px 10px;font-size:12px}

/* ================= B · 卡片墙（海报为主 + 顶部导航） ================= */
.vB{--bg:#fbfaf7;--panel:#fff;--line:#ece7dd;--text:#1a1a1a;--muted:#78716c;--accent:#111;
  background:var(--bg);color:var(--text)}
.vB .top{display:flex;align-items:center;gap:20px;padding:16px 28px;background:rgba(251,250,247,.92);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.vB .brand{font-size:17px;font-weight:700;letter-spacing:-.02em}
.vB .nav{display:flex;gap:4px;background:#f1eee7;border-radius:999px;padding:4px}
.vB .nav a{padding:6px 15px;border-radius:999px;color:#57534e;font-size:13px}
.vB .nav a.on{background:#fff;color:#111;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.vB .grow{flex:1}
.vB input[type=search]{border:1px solid var(--line);border-radius:999px;padding:8px 15px;background:#fff;width:230px}
.vB main{padding:22px 28px 110px;max-width:1360px;margin:0 auto;width:100%}
.vB h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.vB .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.vB .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.vB .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;color:#57534e}
.vB .chip.on{background:#111;color:#fff;border-color:#111}
.vB .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:18px}
.vB .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(28,25,23,.04);transition:transform .12s ease,box-shadow .12s ease}
.vB .card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(28,25,23,.10)}
.vB .card .poster{width:100%;aspect-ratio:2/3;position:relative}
.vB .card .strip{position:absolute;left:0;right:0;bottom:0;height:5px}
.vB .s-succeeded .strip{background:#16a34a}.vB .s-partial .strip{background:#d97706}
.vB .s-failed .strip{background:#dc2626}.vB .s-running .strip{background:#2563eb}
.vB .s-queued .strip{background:#94a3b8}.vB .s-needs_number .strip{background:#7c3aed}
.vB .s-cancelled .strip{background:#9ca3af}
.vB .card .meta{padding:11px 13px 13px}
.vB .card .num{font-family:ui-monospace,monospace;font-weight:600;font-size:13px;letter-spacing:.01em}
.vB .card .ti{color:#57534e;font-size:12.5px;margin:3px 0 8px;height:34px;overflow:hidden}
.vB .card .foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11.5px}
.vB .btn{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 16px;color:#44403c}
.vB .btn.pri{background:#111;border-color:#111;color:#fff;font-weight:600}
.vB .btn.pri[disabled]{background:#d6d3d1;border-color:#d6d3d1;cursor:not-allowed}
.vB .drop{border:2px dashed #d6d3d1;border-radius:20px;padding:30px;text-align:center;background:#fff;margin-bottom:20px}
.vB .drop .big{font-size:17px;font-weight:600;margin-bottom:6px}
.vB .drop .hint{color:var(--muted)}
.vB .roots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.vB .root{background:#f5f5f4;border-radius:999px;padding:5px 13px;font-family:ui-monospace,monospace;font-size:12px}
.vB .root b{font-weight:600}
.vB .cand{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:14px;margin-bottom:11px;align-items:center}
.vB .cand .f16{width:190px;aspect-ratio:16/9;border-radius:10px;flex:0 0 auto}
.vB .cand .info{flex:1;min-width:0}
.vB .cand .num{font-family:ui-monospace,monospace;font-size:17px;font-weight:700}
.vB .cand .files{color:var(--muted);font-size:12px;margin-top:4px}
.vB .cand .mk{display:inline-block;background:#f5f5f4;border-radius:6px;padding:1px 7px;font-size:11px;color:#57534e;margin-top:6px}
.vB .pick{width:22px;height:22px;flex:0 0 auto}
.vB .hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:18px}
.vB .hero .bg{width:100%;aspect-ratio:21/9;filter:saturate(.85)}
.vB .hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.78))}
.vB .hero .in{position:absolute;left:22px;right:22px;bottom:18px;display:flex;gap:16px;align-items:flex-end;color:#fff}
.vB .hero .poster{width:104px;aspect-ratio:2/3;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);flex:0 0 auto}
.vB .hero h2{margin:0 0 4px;font-size:23px;letter-spacing:-.02em}
.vB .hero .m{font-size:12.5px;opacity:.9}
.vB .cols{display:grid;grid-template-columns:1.35fr .95fr;gap:20px}
.vB .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 17px}
.vB .panel h3{margin:0 0 10px;font-size:13px;color:#57534e;letter-spacing:.02em;text-transform:uppercase}
.vB .fld{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f5f3ef;font-size:13px}
.vB .fld .k{width:104px;flex:0 0 auto;color:#78716c}
.vB .fld .v{flex:1;min-width:0;overflow-wrap:anywhere}
.vB .fld .s{color:#a8a29e;font-size:11.5px}
.vB .fld.miss .v{color:#b91c1c}
.vB .wall{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.vB .wall .f16{width:100%;aspect-ratio:16/9;border-radius:8px}
.vB .wall .p23{width:100%;aspect-ratio:2/3;border-radius:8px}
.vB .tl{font-size:12.5px}
.vB .tl .row{display:flex;gap:9px;padding:6px 0;align-items:baseline}
.vB .tl .dot{width:7px;height:7px;border-radius:50%;background:#d6d3d1;flex:0 0 auto;position:relative;top:-2px}
.vB .tl .row.ok .dot{background:#16a34a}.vB .tl .row.bad .dot{background:#dc2626}
.vB .tl .nm{width:62px;flex:0 0 auto;color:#57534e}
.vB .tl .ms{margin-left:auto;color:#a8a29e;font-variant-numeric:tabular-nums}
.vB .srcrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f5f3ef;font-size:12.5px}
.vB .empty{padding:60px;text-align:center;color:var(--muted)}
.vB .empty .big{font-size:19px;font-weight:600;color:#44403c;margin-bottom:6px}
.vB .err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px 16px;border-radius:14px;margin-bottom:16px}
.vB .skeleton{border-radius:16px;height:322px}
.vB .loadmore{display:flex;justify-content:center;margin-top:22px;color:var(--muted);font-size:12.5px;gap:12px;align-items:center}
.vB .cand .chips{display:flex;gap:5px;margin-top:8px}

  cols.forEach(function(c){

    h += '<div class="col"><h4>'+c[0]+'<span class="n">'+list.length+'</span></h4>';
    list.forEach(function(t){
      h += '<div class="tc b-'+t.status+'" data-detail="'+t.num+'">'
       + (t.status!=='queued'&&t.status!=='cancelled'?fanImg(t.hue,t.num,'thumb'):'')
       + '<div class="num">'+t.num+'</div><div class="ti">'+t.title+'</div>'
       + '<div class="ft"><span>'+st(t.status)+'</span><span>'+t.updated+'</span></div>'
       + (t.err?'<div class="ft" style="color:#fca5a5">'+t.err+'</div>':'')
       + (t.status==='needs_number'?'<div class="ft"><span class="badge">去填号 →</span></div>':'')
       + '</div>';
    });
    h += '</div>';
  });
  h += '</div><div class="panel" style="margin-top:12px;color:#8b949e;font-size:12px">'
   + '看板按状态分列（每列只显示最近 5 个，更多进列表视图）；阶段来自最新一条 step_runs.type</div>';
  return h;
}
function cDetail(){
  var d = DETAILS[S.detail];
  if(S.state==='loading') return '<h1>任务详情</h1><div class="panel"><div class="sk" style="height:180px"></div></div>';
  if(S.state==='empty') return '<h1>任务详情</h1><div class="panel"><div class="empty"><div class="big">任务不存在</div></div></div>';
  var h = '<h1>'+d.number+' <span style="color:#6f7b88;font-weight:400">'+d.title+'</span></h1>'
   + '<div class="sub">'+st(d.status)+' · 批次 '+d.batch+' · '+d.trigger+' · 硬链 '+d.link
   + (d.missing.length?' · 缺字段 '+d.missing.length:'')+'</div>';
  h += '<div class="panels"><div class="panel"><h3>步骤时间线（任务级后缀从 parse 起可重跑）</h3><div class="tl">'
   + d.steps.map(function(s){return '<div class="row '+stepCls(s[1])+'"><span class="nm mono">'+s[0]+'</span>'
     + '<span class="sum">'+s[3]+'</span><span class="ms">'+(s[1]==='—'?'—':s[2]+' ms')+'</span></div>'}).join('')
   + '</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri">从 parse 起重跑</button>'
   + '<button class="btn">取消任务</button><button class="btn">复制路径 '+d.out+'</button></div></div>'
   + '<div><div class="panel"><h3>图片</h3><div class="wall" style="grid-template-columns:repeat(2,1fr)">'
   + '<div style="grid-row:span 2">'+posterImg(d.hue,d.number,'p23')+'</div>'+fanImg(d.hue,'fanart','f16')
   + fanImg(d.hue+9,'剧照 1','f16')+fanImg(d.hue+18,'剧照 2','f16')+'</div></div>'
   + '<div class="panel" style="margin-top:12px"><h3>源留痕</h3>'
   + d.srcs.map(function(s){return '<div class="src"><span class="mono" style="width:52px">'+s[0]+'</span>'
     + '<span>'+st(s[1]==='ok'?'succeeded':(s[1]==='failed'?'failed':'cancelled'))+'</span>'
     + (s[2]?'<span class="reason">'+reasonLabel(s[2])+'</span>':'')
     + '<span style="margin-left:auto;color:#6f7b88">'+s[3]+' 字段 · '+s[4]+'ms</span></div>'}).join('')
   + '</div></div></div>';
  h += '<div class="panel" style="margin-top:12px"><h3>字段与来源（14 源级字段 + number）</h3>'
   + d.fields.map(function(f){return '<div class="kv '+(f[1]==='—'?'miss':'')+'"><span class="k mono">'+f[0]+'</span>'
     + '<span class="v">'+f[1]+'</span><span class="s">'+(f[2]||'—')+'</span></div>'}).join('')+'</div>';
  if(d.rows.length){
    h += '<div class="panel" style="margin-top:12px"><h3>落盘台账 '+d.rows.length+' 条</h3>'
     + d.rows.map(function(r){return '<div class="src"><span class="mono" style="width:52px">'+r[0]+'</span>'
       + '<span style="flex:1;font-size:11.5px" class="mono">'+r[4]+'</span>'
       + '<span style="color:#6f7b88">'+r[5]+'</span><span class="badge" style="margin-left:8px">'+r[6]+'</span></div>'}).join('')
     + '</div>';
  }
  return h;
}
function cNumbers(){
  var h = '<h1>待补号队列</h1><div class="sub">填号 ⇒ 任务回 queued ⇒ 新 task_run 从 parse 起跑；未填期间仍占路径</div>';
  if(S.state==='empty') return h + '<div class="panel"><div class="empty"><div class="big">队列是空的</div></div></div>';
  NUMBERS.forEach(function(n){
    h += '<div class="panel" style="margin-bottom:12px"><h3>'+n.task+' · '
     + (n.kind==='ambiguous'?'解析分歧':'主干相同（duplicate_stem）')+'</h3>';
    n.files.forEach(function(f){
      var key = n.task+'|'+f.p;
      h += '<div class="scanrow primary"><span class="num"></span><span class="mono">'+f.p+'</span>'
       + '<span class="badge'+(f.primary?'':' warn')+'">'+(f.primary?'primary':'分片')+'</span>'
       + '<span class="fill" style="margin-left:auto">'
       + f.cands.map(function(c){return '<button class="'+(S.nums[key]===c?'on':'')+'" data-num="'+key+'|'+c+'">'+c+'</button>'}).join('')
       + '<input value="'+(S.nums[key]||'')+'" placeholder="番号">'
       + '<label style="color:#8b949e"><input type="checkbox" class="ck" '+(f.part?'checked':'')+'> 分片</label></span></div>';
    });
    h += '<div style="display:flex;gap:8px;margin-top:10px"><span style="flex:1"></span>'
     + '<button class="btn">跳过（取消任务）</button><button class="btn pri">提交并重跑</button></div></div>';
  });
  return h;
}

/* ================= 渲染与交互 ================= */
function render(){
  var app = document.getElementById('app');
  app.className = 'app v'+S.variant;
  if(S.variant==='A') app.innerHTML = aShell(S.view);
  else if(S.variant==='B') app.innerHTML = bShell(S.view);
  else app.innerHTML = cShell(S.view);
  app.insertAdjacentHTML('beforeend', pickHTML());
  renderBar();
}
function renderBar(){
  var v = VARIANTS.filter(function(x){return x[0]===S.variant})[0];
  var h = '<span class="tag">prototype</span><div class="seg">'
   + '<button class="arrow" data-act="prev">←</button>'
   + '<span class="lbl">'+v[0]+' · '+v[1]+'</span>'
   + '<button class="arrow" data-act="next">→</button></div><div class="sep"></div><div class="seg">'
   + VIEWS.map(function(x){return '<button data-view="'+x[0]+'" class="'+(S.view===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')
   + '</div><div class="sep"></div><div class="seg">'
   + STATES.map(function(x){return '<button data-state="'+x[0]+'" class="'+(S.state===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')
   + '</div><div class="sep"></div><div class="seg">'
   + ['SSIS-001','ABP-123','FC2-3336019','SSVR-122'].map(function(n){
      return '<button data-detail="'+n+'" class="'+(S.detail===n?'on':'')+'">'+n+'</button>'}).join('')
   + '</div>';
  document.getElementById('bar').innerHTML = h;
}
function set(o){ for(var k in o) S[k]=o[k]; writeURL(); render(); }
function cycle(dir){
  var i = VARIANTS.map(function(x){return x[0]}).indexOf(S.variant);
  i = (i + dir + VARIANTS.length) % VARIANTS.length;
  set({variant:VARIANTS[i][0]});
}
document.addEventListener('click', function(e){
  var img = e.target.closest('.ph');
  if(img && S.view==='detail'){ openLB(img.style.backgroundImage); return; }
  if(e.target.id==='lb'){ closeLB(); return; }
  if(e.target.classList && e.target.classList.contains('modal')){
    S.picker.open=false; render(); return;
  }
  var el = e.target.closest('[data-act],[data-view],[data-state],[data-detail],[data-tab],[data-num],[data-g],[data-row],[data-pk],[data-chip]');
  if(!el) return;
  if(el.dataset.pk){
    var pk = el.dataset.pk;
    if(pk==='open'){
      S.picker.open = true; S.picker.err = '';
      S.picker.mode = el.dataset.pkMode || 'root';
      S.picker.path = S.roots[0] || BROWSER_ROOTS[0].path;
      render(); return;
    }
    if(pk==='close'){ S.picker.open=false; render(); return; }
    if(pk==='go' || pk==='mount'){ S.picker.path = el.dataset.pkPath; S.picker.err=''; render(); return; }
    if(pk==='up'){
      var q = S.picker.path.replace(/\/[^\/]+\/?$/, '');
      S.picker.path = (q.length < BROWSER_ROOTS[0].path.length) ? BROWSER_ROOTS[0].path : q;
      S.picker.err=''; render(); return;
    }
    if(pk==='jump'){
      var inp = document.getElementById('pkpath');
      var v = ((inp && inp.value) || '').replace(/\s+$/, '');
      S.picker.path = v || BROWSER_ROOTS[0].path;
      S.picker.err = mountOf(S.picker.path) ? ''
        : '不在可浏览根内（browse_roots: /media）—— 只允许 /media 及其子目录';
      render(); return;
    }
    if(pk==='apply'){
      var mode = el.dataset.pkMode, path = S.picker.path;
      if(!mountOf(path)){ S.picker.err = '不在可浏览根内（browse_roots: /media）'; render(); return; }
      if(mode==='root'){
        if(S.roots.indexOf(path) < 0) S.roots.push(path);
      } else {
        var under = false;
        S.roots.forEach(function(r){ if(path.indexOf(r+'/')===0) under = true; });
        if(!under){ S.picker.err = '排除目录必须是某个根目录的真子目录（#10 的校验规则）'; render(); return; }
        if(S.excludes.indexOf(path) < 0) S.excludes.push(path);
      }
      S.picker.open = false; render(); return;
    }
  }
  if(el.dataset.chip){
    var kind = el.dataset.chip, cp = el.dataset.chipPath;
    if(kind==='root') S.roots = S.roots.filter(function(x){return x!==cp});
    else S.excludes = S.excludes.filter(function(x){return x!==cp});
    render(); return;
  }
  if(el.dataset.row!==undefined && el.classList.contains('rowpick')){
    var r = el.dataset.row;
    if(S.rows[r]) delete S.rows[r]; else S.rows[r]=true;
    render(); return;
  }
  if(el.dataset.act==='prev') return cycle(-1);
  if(el.dataset.act==='next') return cycle(1);
  if(el.dataset.view){
    var v = el.dataset.view;
    if(v==='detail' && S.view!=='detail') return set({view:'detail'});
    return set({view:v});
  }
  if(el.dataset.state) return set({state:el.dataset.state});
  if(el.dataset.detail){
    var n = el.dataset.detail;
    if(DETAILS[n]) return set({detail:n, view:'detail'});
    return set({view:'detail'});
  }
  if(el.dataset.tab) return set({tab:el.dataset.tab});
  if(el.dataset.num){
    var p = el.dataset.num.split('|');
    var key = p[0]+'|'+p[1], val = p[2];
    S.nums[key] = (S.nums[key]===val ? '' : val);
    writeURL(); render(); return;
  }
  if(el.dataset.g!==undefined && el.classList.contains('pick')){
    var g = el.dataset.g;
    if(S.picked[g]) delete S.picked[g]; else S.picked[g]=true;
    writeURL(); render(); return;
  }
});
document.addEventListener('keydown', function(e){
  var t = document.activeElement;
  if(t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  if(e.key==='Escape'){
    if(S.picker.open){ S.picker.open=false; render(); } else closeLB();
    return;
  }
  if(S.picker.open) return;
  if(e.key==='ArrowLeft') cycle(-1);
  if(e.key==='ArrowRight') cycle(1);
});
function openLB(bg){
  var m = /url\(["']?(.*?)["']?\)/.exec(bg||'');
  if(!m) return;
  var lb = document.getElementById('lb');
  lb.querySelector('img').src = m[1];
  lb.classList.add('on');
}
function closeLB(){ document.getElementById('lb').classList.remove('on'); }
readURL(); render();
</script>
