<!doctype html>
<!--
  PROTOTYPE — throwaway. 回答一个问题：三视图（扫描预览 / 任务列表 / 任务详情）长什么样。
  不是产品代码：没有构建、没有依赖、没有测试，假数据在内存里。
  打开方式：双击本文件（无构建、无依赖、无网络请求）。file:// 下浏览器会禁掉 history.replaceState，
  所以那种情况地址栏不跟着变（交互不受影响）；要可分享的带参 URL 就 `python3 -m http.server`。
  URL 参数：?variant=A|B|C&view=scan|tasks|detail|numbers&state=normal|loading|empty|error
  底部的浮动条是原型专用的（生产里按 NODE_ENV 关掉）。

  【已裁决，见 issue #11】基线 = 变体 A（运维台表格）；扫描预览跑到 `--until parse`（修正 #2）；
  图片走 API 缩放端点（视频不抽帧）；生产样式 = Tailwind v4（本文件手写 CSS 只为无构建即开）；
  分页 = 页码 + 每页；搜索只搜番号；批量只做重跑；批次只做筛选项；详情页不放日志（只用 step_runs/source_runs）；
  填号两处都能填；「打开输出目录」= 复制路径 + 落盘台账；默认排序 = 创建时间倒序。
  根目录/排除 = 容器内目录选择器（弹窗 + 面包屑 + 子目录列表 + 手输路径 + 两个动作），
  可浏览范围 = `browse_roots` 白名单（默认 ["/media"]），路径只显示容器内绝对路径 + 挂载点标签。

  【质量通道，见 audit 报告】七个命令跑过一遍，改动都在这份文件里：
  · colorize：7 状态色收敛成一处 token（ink/mark/tint 三档），浅底全部 ≥4.5:1、深底 ≥5.5:1，
    紫罗兰 tell 换成品红；来源列/侧栏/浮动条的对比度补齐；彩色底上的次级文字取自同色相而非灰。
  · layout：4 基间距刻度 token 化；触控目标 ≥24px（coarse 指针 ≥44px）；密度与节奏分档。
  · typeset：角色字阶 token 化，功能性文字地板 12px（原 10/11.5px 全部抬掉）；表格数字 tabular-nums；
    标题 text-wrap:balance、正文 pretty；深底补偿行高与字重。
  · animate：动效 token（时长/缓动）+ 一个作者化的入场（对话框/灯箱）；prefers-reduced-motion 走「减动不减状态」。
  · adapt：内容驱动断点 640/768/1024；窄屏表格转记录卡（data-label）、看板横向滚动、弹窗变底部抽屉；
    pointer:coarse 抬触控目标；safe-area + viewport-fit。
  · harden：可点元素改真 button/a（键盘可达）、每个控件有可访问名称、对话框焦点陷阱与焦点归还、
    aria-live 播报选中数、长文本截断/换行、esc() 转义、逻辑属性（RTL）、错误文案给出恢复动作。
  · polish：灯箱按需渲染 <img> 并带 alt、th scope/caption、标题层级修正、图标改作者化 SVG（去 emoji）、
    C 变体的嵌套卡片与 3px 左边条去掉、原型标记在界面里可见。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mdc-lite 三视图原型</title>
<style>
/* ============================================================
   1. tokens —— 颜色/间距/字阶/圆角/动效，只在这一处定义
   ============================================================ */
:root{
  color-scheme:light;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* 间距（4 基刻度 + 层次韵律） */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:36px; --sp-8:48px;
  /* 字阶（主次分明、排版节奏） */
  --fs-micro:11.5px; --fs-body:13.5px; --fs-lead:16px; --fs-title:20px; --fs-display:26px;
  --lh-body:1.5; --lh-prose:1.65;
  /* 圆角 */
  --r-1:4px; --r-2:6px; --r-3:8px; --r-4:12px; --r-5:16px; --r-pill:999px;
  /* 动效 */
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms; --ease-out:cubic-bezier(.16,1,.3,1);

  /* 表面与文本（浅） */
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f6;
  --line:#e2e6ed; --line-strong:#cbd2dd;
  --text:#0f141a;            /* 18.2:1 on surface */
  --text-2:#525d6d;          /* 6.5:1 on surface · 6.0:1 on bg */
  --text-3:#667282;          /* 4.8:1 on surface（只在白底用，不上画布） */
  --accent:#1b4fcc; --accent-ink:#ffffff; --accent-soft:#edf3fe;
  --focus:#1b4fcc;

  /* 状态色：一处定义，三处（A 表格 / B 色条 / C 看板）都引用这里
     ink = 文本（浅底 ≥4.5:1）· mark = 图形/色条（≥3:1）· tint = 极浅底 */
  --st-succeeded-ink:#0e682e;    --st-succeeded-mark:#16a34a;    --st-succeeded-tint:#edf7f0;
  --st-partial-ink:#853e05;      --st-partial-mark:#d97706;      --st-partial-tint:#fef6eb;
  --st-failed-ink:#981b1b;       --st-failed-mark:#dc2626;       --st-failed-tint:#fef2f2;
  --st-running-ink:#1a4fcc;      --st-running-mark:#2563eb;      --st-running-tint:#eef4ff;
  --st-queued-ink:#4b5563;       --st-queued-mark:#64748b;       --st-queued-tint:#f1f4f8;
  --st-needs_number-ink:#931b9e; --st-needs_number-mark:#c026d3; --st-needs_number-tint:#fdf2fd;
  --st-cancelled-ink:#505763;    --st-cancelled-mark:#94a3b8;    --st-cancelled-tint:#f1f4f8;

  /* 深底用的状态 ink：深色主题与「图片叠加区」两处共用同一套原语 */
  --st-succeeded-ink-dk:#4ade80; --st-partial-ink-dk:#fbbf24; --st-failed-ink-dk:#f87171;
  --st-running-ink-dk:#7cb0ff; --st-queued-ink-dk:#a3b1c2; --st-needs_number-ink-dk:#f0a6e8;
  --st-cancelled-ink-dk:#98a5b4;

  /* 原型壳（浮动条）：与产品配色分离，避免被当成产品的一部分 */
  --shell-bg:#1e242e; --shell-text:#f1f5f9; --shell-text-2:#94a3b8; --shell-line:#334155;

  /* 阴影多层柔化 */
  --shadow-1:0 1px 3px rgba(15,20,26,.04),0 1px 2px rgba(15,20,26,.02);
  --shadow-2:0 4px 16px rgba(15,20,26,.07),0 2px 6px rgba(15,20,26,.04);
  --shadow-3:0 20px 48px rgba(10,12,16,.25),0 8px 16px rgba(10,12,16,.12);
}
/* 深色是「组合」出来的，不是把浅色反转：表面分级、文本层级、状态 ink 各自重定 */
.theme-dark{
  color-scheme:dark;
  --bg:#0b0e14; --surface:#131821; --surface-2:#19202a; --surface-3:#202835;
  --line:#25303f; --line-strong:#364355;
  --text:#e6edf5; --text-2:#9eacbe; --text-3:#7f8ea2;
  --accent:#7cb0ff; --accent-ink:#08101e; --accent-soft:#16243d;
  --focus:#7cb0ff;
  --st-succeeded-ink:#4ade80;    --st-succeeded-mark:#4ade80;    --st-succeeded-tint:#102519;
  --st-partial-ink:#fbbf24;      --st-partial-mark:#fbbf24;      --st-partial-tint:#261e12;
  --st-failed-ink:#f87171;       --st-failed-mark:#f87171;       --st-failed-tint:#281515;
  --st-running-ink:#7cb0ff;      --st-running-mark:#7cb0ff;      --st-running-tint:#16243d;
  --st-queued-ink:#94a3b8;       --st-queued-mark:#94a3b8;       --st-queued-tint:#1b232f;
  --st-needs_number-ink:#f0a6e8; --st-needs_number-mark:#f0a6e8; --st-needs_number-tint:#28182a;
  --st-cancelled-ink:#94a3b8;    --st-cancelled-mark:#94a3b8;    --st-cancelled-tint:#1b232f;
  --shadow-1:0 1px 3px rgba(0,0,0,.35);
  --shadow-2:0 4px 16px rgba(0,0,0,.45);
  --shadow-3:0 20px 48px rgba(0,0,0,.65);
}
/* 图片叠加区（不是整块深色主题，只是局部深底）：只重映状态 ink + 文本色 */
.on-dark{
  --st-succeeded-ink:var(--st-succeeded-ink-dk); --st-partial-ink:var(--st-partial-ink-dk);
  --st-failed-ink:var(--st-failed-ink-dk);       --st-running-ink:var(--st-running-ink-dk);
  --st-queued-ink:var(--st-queued-ink-dk);       --st-needs_number-ink:var(--st-needs_number-ink-dk);
  --st-cancelled-ink:var(--st-cancelled-ink-dk);
  color:#f4f7fb;
}

/* ============================================================
   2. 基础 + 浏览器表面（选区/光标/滚动条/焦点环都从调色板来）
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font:var(--fs-body)/var(--lh-body) var(--font-ui);
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; caret-color:var(--accent);
  overflow-wrap:break-word;
}
::selection{background:var(--accent-soft);color:var(--text)}
*{scrollbar-color:var(--line-strong) transparent;scrollbar-width:thin}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-1)}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em;margin:0}
p{text-wrap:pretty;margin:0}
a{color:var(--accent);text-underline-offset:3px}
table{border-collapse:collapse;width:100%}
caption{text-align:start;color:var(--text-3);font-size:var(--fs-micro);padding-block-end:var(--sp-2)}
th{text-align:start;font-size:var(--fs-micro);font-weight:600;color:var(--text-2);
   background:var(--surface-2);border-block-end:1px solid var(--line);padding:var(--sp-2) var(--sp-3);white-space:nowrap}
td{padding:var(--sp-2) var(--sp-3);border-block-end:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-block-end:0}

/* 工具类 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:var(--sp-3);top:-56px;z-index:300;background:var(--surface);
  color:var(--text);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);box-shadow:var(--shadow-2);
  transition:top var(--dur-fast) var(--ease-out)}
.skip:focus{top:var(--sp-3)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
[dir="rtl"] .ic-dir{transform:scaleX(-1)}

/* 控件（三变体共用） */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);min-height:28px;
  padding:0 var(--sp-3);background:var(--surface);color:var(--text);
  border:1px solid var(--line-strong);border-radius:var(--r-2);font:inherit;cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.btn:hover:not([disabled]){background:var(--surface-3)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn[disabled]{background:var(--surface-2);color:var(--text-3);border-color:var(--line);cursor:not-allowed}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-pri:hover:not([disabled]){background:var(--accent);filter:brightness(1.08)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-quiet:hover:not([disabled]){background:var(--surface-3);color:var(--text)}
.btn-sm{min-height:24px;padding:0 var(--sp-2);font-size:var(--fs-micro)}
.btn-danger{color:var(--st-failed-ink);border-color:var(--st-failed-tint)}
.btn-danger:hover:not([disabled]){background:var(--st-failed-tint)}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-2);padding:0 var(--sp-2);min-height:28px}
input::placeholder{color:var(--text-3)}
input[type=checkbox]{width:16px;height:16px;min-height:0;padding:0;accent-color:var(--accent)}
input[type=search]{-webkit-appearance:none;appearance:none}
.ckwrap{display:inline-flex;align-items:center;justify-content:center;padding:var(--sp-2);cursor:pointer;border-radius:var(--r-1)}
@media (pointer:coarse){
  .btn{min-height:44px;padding:var(--sp-2) var(--sp-4)}
  .btn-sm{min-height:44px;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-body)}
  .chip{min-height:44px;padding:0 var(--sp-3);font-size:14px}
  .cand button{min-height:44px;padding:0 var(--sp-3);font-size:14px}
  .tabs [role=tab]{min-height:44px;padding:var(--sp-2) var(--sp-4)}
  input,select,textarea{min-height:44px;font-size:16px}   /* 16px：避免 iOS 聚焦缩放 */
  input[type=checkbox]{width:22px;height:22px}
  .ckwrap{padding:var(--sp-3)}
  #bar button{min-height:44px;padding:0 var(--sp-3)}
}
.chips{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:28px;padding:0 var(--sp-3);
  border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);
  color:var(--text-2);font-size:var(--fs-micro);cursor:pointer;
  transition:all var(--dur-fast) var(--ease-out)}
.chip:hover{background:var(--surface-3);color:var(--text);border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--surface);font-weight:600}
.num-badge{display:inline-block;font-family:var(--font-mono);font-weight:700;letter-spacing:.02em;color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:var(--sp-1);padding:1px var(--sp-2);border-radius:var(--r-1);
  background:var(--surface-3);color:var(--text-2);font-size:var(--fs-micro)}
.tag-mono{font-family:var(--font-mono);font-size:var(--fs-micro);padding:1px var(--sp-2);
  border-radius:var(--r-1);background:var(--surface-3);color:var(--text-2)}
.notice{display:flex;gap:var(--sp-2);align-items:flex-start;padding:var(--sp-2) var(--sp-3);
  border-radius:var(--r-2);font-size:var(--fs-micro);line-height:var(--lh-body)}
.notice .ic{margin-block-start:2px}
.notice-error{background:var(--st-failed-tint);color:var(--st-failed-ink)}
.notice-warn{background:var(--st-partial-tint);color:var(--st-partial-ink)}
.notice-info{background:var(--accent-soft);color:var(--st-running-ink)}
.notice .act{margin-inline-start:auto;flex:0 0 auto}
.empty{padding:var(--sp-8) var(--sp-4);text-align:center;color:var(--text-2)}
.empty .big{font-size:var(--fs-lead);font-weight:600;color:var(--text);margin-block-end:var(--sp-1)}
.sk{background:var(--surface-3);border-radius:var(--r-1);
  animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.55}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ph{display:block;background-size:cover;background-position:center;background-color:var(--surface-3)}
.phbtn{border:0;padding:0;cursor:zoom-in;appearance:none;-webkit-appearance:none}
.phbtn:hover{filter:brightness(1.06)}

/* 状态（唯一来源：上面的 --st-* token） */
.st{display:inline-flex;align-items:center;gap:var(--sp-1);white-space:nowrap;
  font-size:var(--fs-micro);font-weight:600}
.st .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.st-succeeded{color:var(--st-succeeded-ink)} .st-partial{color:var(--st-partial-ink)}
.st-failed{color:var(--st-failed-ink)} .st-running{color:var(--st-running-ink)}
.st-queued{color:var(--st-queued-ink)} .st-needs_number{color:var(--st-needs_number-ink)}
.st-cancelled{color:var(--st-cancelled-ink)}
.mark{width:4px;border-radius:var(--r-pill);flex:0 0 auto}
.mark-succeeded{background:var(--st-succeeded-mark)} .mark-partial{background:var(--st-partial-mark)}
.mark-failed{background:var(--st-failed-mark)} .mark-running{background:var(--st-running-mark)}
.mark-queued{background:var(--st-queued-mark)} .mark-needs_number{background:var(--st-needs_number-mark)}
.mark-cancelled{background:var(--st-cancelled-mark)}

/* ============================================================
   3. 原型控制条（原型专用，不进产品）
   ============================================================ */
#bar{position:fixed;inset-inline:0;bottom:0;z-index:900;display:flex;justify-content:center;
  padding:var(--sp-3) var(--sp-3) max(var(--sp-3),env(safe-area-inset-bottom));pointer-events:none}
#bar .inner{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;justify-content:center;
  padding:var(--sp-1) var(--sp-2);border-radius:var(--r-pill);background:var(--shell-bg);
  border:1px solid var(--shell-line);box-shadow:var(--shadow-2);pointer-events:auto;max-width:100%}
#bar .seg{display:flex;align-items:center;gap:2px;background:#232a35;border-radius:var(--r-pill);padding:2px}
#bar button{background:transparent;border:0;color:var(--shell-text-2);font:inherit;font-size:var(--fs-micro);
  min-height:26px;padding:0 var(--sp-2);border-radius:var(--r-pill);cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
#bar button:hover{background:#39424f;color:var(--shell-text)}
#bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
#bar .lbl{min-width:104px;text-align:center;color:var(--shell-text);font-weight:600;font-size:var(--fs-micro)}
#bar .tag{background:#39424f;color:var(--shell-text-2);letter-spacing:.08em;text-transform:uppercase;font-size:var(--fs-micro)}
#bar .sep{width:1px;align-self:stretch;background:var(--shell-line)}
@media (pointer:coarse){#bar button{min-height:40px;padding:0 var(--sp-3)}}

/* ============================================================
   4. 对话框（目录选择器 + 灯箱）：入场是这一版的作者化瞬间
   ============================================================ */
.dlg{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;
  background:rgba(10,12,16,.55);padding:var(--sp-6);
  animation:fade var(--dur-base) var(--ease-out)}
.dlg .box{width:min(640px,100%);background:var(--surface);color:var(--text);border-radius:var(--r-4);
  box-shadow:var(--shadow-3);overflow:hidden;display:flex;flex-direction:column;max-height:min(88vh,720px);
  animation:rise var(--dur-base) var(--ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dlg h2{margin:0;padding:var(--sp-3) var(--sp-4);border-block-end:1px solid var(--line);
  font-size:var(--fs-lead);display:flex;align-items:center;gap:var(--sp-2)}
.dlg .crumb{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-4);border-block-end:1px solid var(--line);font-size:var(--fs-micro)}
.dlg .crumb .sep{color:var(--text-3)}
.dlg .jump{display:flex;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);border-block-end:1px solid var(--line)}
.dlg .jump input{flex:1;font-family:var(--font-mono)}
.dlg .list{overflow:auto;padding:var(--sp-1)}
.dlg .item{display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:start;background:transparent;
  border:0;font:inherit;color:var(--text);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);cursor:pointer;
  min-height:34px;transition:background var(--dur-fast) var(--ease-out)}
.dlg .item:hover{background:var(--surface-3)}
.dlg .item .n{flex:1;font-family:var(--font-mono);min-width:0}
.dlg .item .c{color:var(--text-3);font-size:var(--fs-micro);flex:0 0 auto}
.dlg .foot{display:flex;gap:var(--sp-2);align-items:center;padding:var(--sp-3) var(--sp-4);
  border-block-start:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.dlg .foot .path{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-2);
  min-width:0;flex:1 1 140px}
.dlg .err{margin:0 var(--sp-4) var(--sp-2)}
#lb{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:var(--sp-6);
  background:rgba(8,10,14,.94);cursor:zoom-out;animation:fade var(--dur-base) var(--ease-out)}
#lb:empty{display:none}   /* 没内容时不占位、不遮住页面 */
#lb img{max-width:100%;max-height:82vh;border-radius:var(--r-3);box-shadow:var(--shadow-3)}
#lb .cap{position:absolute;inset-inline:0;bottom:var(--sp-6);text-align:center;color:#dbe3ec;font-size:var(--fs-micro)}
#lb .close{position:absolute;top:var(--sp-4);inset-inline-end:var(--sp-4);background:#2b3340;color:#f2f5f9;
  border:1px solid var(--shell-line);border-radius:var(--r-pill);min-height:32px;padding:0 var(--sp-3);cursor:pointer}
@media (max-width:640px){
  .dlg{align-items:flex-end;padding:0}
  .dlg .box{width:100%;max-height:92vh;border-radius:var(--r-5) var(--r-5) 0 0}
  .dlg .foot{padding-block-end:max(var(--sp-3),env(safe-area-inset-bottom))}
}

/* ============================================================
   5. 变体 A · 运维台（基线）
   ============================================================ */
.vA{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.vA .top{display:flex;align-items:center;gap:var(--sp-3);min-height:48px;padding:var(--sp-2) var(--sp-4);
  background:var(--surface);border-block-end:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.vA .layout{display:flex;flex:1;min-height:0}
.vA .side{flex:0 0 196px;background:var(--surface);border-inline-end:1px solid var(--line);padding:var(--sp-2)}
.vA .side .navlink{display:flex;align-items:center;gap:var(--sp-2);min-height:32px;padding:0 var(--sp-2);
  border-radius:var(--r-2);color:var(--text-2);font-size:var(--fs-body)}
.vA .side .navlink:hover{background:var(--surface-3);color:var(--text)}
.vA .side .navlink[aria-current="page"]{background:var(--accent-soft);color:var(--st-running-ink);font-weight:600}
.vA .side .navlink .n{margin-inline-start:auto;background:var(--surface-3);color:var(--text-2);
  border-radius:var(--r-pill);padding:0 var(--sp-2);font-size:var(--fs-micro)}
.vA .side .navlink .n.warn{background:var(--st-needs_number-tint);color:var(--st-needs_number-ink)}
.vA .side .sec{color:var(--text-3);font-size:var(--fs-micro);padding:var(--sp-3) var(--sp-2) var(--sp-1);
  letter-spacing:.04em}
.vA .side .dead{color:var(--text-2);font-size:var(--fs-body);padding:var(--sp-1) var(--sp-2);
  display:block;min-height:28px}
.vA main{flex:1;min-width:0;padding:var(--sp-5) var(--sp-6) max(112px,calc(64px + env(safe-area-inset-bottom)));overflow:auto}
.vA .page-h{font-size:var(--fs-title);font-weight:700;margin-block-end:var(--sp-2)}
.vA .sub{color:var(--text-2);font-size:var(--fs-micro);margin-block-end:var(--sp-5)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-1)}
.card + .card{margin-block-start:var(--sp-5)}
.filters{display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-4)}
.filter-controls{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;border-block-start:1px dashed var(--line);padding-block-start:var(--sp-3)}
.search-wrap{position:relative;display:flex;align-items:center;flex:1 1 280px}
.search-wrap input{width:100%;min-height:30px;padding-inline-start:30px;font-family:var(--font-mono);font-size:var(--fs-body)}
.search-icon{position:absolute;inset-inline-start:8px;color:var(--text-3);display:flex;align-items:center;pointer-events:none}
.select-group{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-inline-start:auto}
.filters .field{display:flex;align-items:center;gap:var(--sp-1)}
.filters .flabel{color:var(--text-2);font-size:var(--fs-micro)}
.row{display:flex;align-items:center;gap:var(--sp-2)}
.grow{flex:1;min-width:0}
.pg{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);color:var(--text-2);
  font-size:var(--fs-micro);flex-wrap:wrap}
.pg .pn{min-width:28px;min-height:26px;padding:0 var(--sp-1)}
.pg .pn[aria-current="page"]{background:var(--text);border-color:var(--text);color:var(--surface);font-weight:600}
.stickybar{position:sticky;bottom:0;display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  padding:var(--sp-3) var(--sp-4) max(var(--sp-3),env(safe-area-inset-bottom));background:var(--surface);border-block-start:1px solid var(--line);border-radius:0 0 var(--r-3) var(--r-3)}
.stickybar .sum{font-size:var(--fs-micro);color:var(--text-2)}
.thumb{width:32px;height:48px;aspect-ratio:2/3;border-radius:var(--r-1);flex:0 0 auto}
.tabs{display:flex;gap:4px;border-block-end:1px solid var(--line);margin-block-start:var(--sp-6);flex-wrap:wrap}
.tabs [role=tab]{background:transparent;border:0;border-block-end:2px solid transparent;padding:var(--sp-2) var(--sp-4);
  color:var(--text-2);font:inherit;font-size:var(--fs-body);font-weight:500;cursor:pointer;min-height:38px;
  transition:color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.tabs [role=tab]:hover{color:var(--text)}
.tabs [role=tab][aria-selected="true"]{color:var(--st-running-ink);border-block-end-color:var(--accent);font-weight:600}
.tabpanel{border:1px solid var(--line);border-block-start:0;border-radius:0 0 var(--r-3) var(--r-3);background:var(--surface);padding:0}
.fields .frow{display:grid;grid-template-columns:140px minmax(0,1fr) 110px;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-4);border-block-end:1px solid var(--line);font-size:var(--fs-body)}
.fields .frow:last-child{border-block-end:0}
.fields .k{color:var(--text-2);font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:500}
.fields .v{min-width:0;line-height:var(--lh-body);text-wrap:pretty}
.fields .s{color:var(--text-3);font-size:var(--fs-micro);text-align:end}
.fields .frow.miss .v{color:var(--st-failed-ink)}
.fields .head{background:var(--surface-2);font-weight:600;font-size:var(--fs-micro);color:var(--text-2)}
.dhead{display:flex;gap:var(--sp-5);align-items:flex-start;padding:var(--sp-4);flex-wrap:wrap}
.dhead .poster{width:112px;aspect-ratio:2/3;height:auto;border-radius:var(--r-2);flex:0 0 auto;box-shadow:var(--shadow-1)}
.poster-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.crop-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--text-2);
  background:var(--surface-3);padding:1px 8px;border-radius:var(--r-pill);border:1px solid var(--line);
  font-family:var(--font-mono);letter-spacing:.02em;white-space:nowrap}
.strip{display:flex;gap:var(--sp-3);overflow:auto;padding-block-end:var(--sp-2)}
.strip .f16{width:176px;aspect-ratio:16/9;height:auto;border-radius:var(--r-2);flex:0 0 auto}
.strip-item{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.strip-item .cap{font-size:10.5px;color:var(--text-3);text-align:center;max-width:176px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;padding:var(--sp-3);color:var(--text-2);
  font-size:var(--fs-micro);border-block-end:1px solid var(--line)}
.prog .done{color:var(--st-succeeded-ink)}
.prog .now{color:var(--st-running-ink);font-weight:600}
.filtered{padding:0 var(--sp-3) var(--sp-3)}
.filtered .frow{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:var(--sp-2);
  padding:var(--sp-1) 0;border-block-end:1px solid var(--line);font-size:var(--fs-micro)}
.filtered .r{color:var(--text-2)}
.fillrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:var(--sp-2);align-items:center;
  padding:var(--sp-2) 0;border-block-end:1px solid var(--line)}
.cand{display:inline-flex;gap:var(--sp-1);flex-wrap:wrap}
.cand button{min-height:26px;padding:0 var(--sp-2);border-radius:var(--r-2);cursor:pointer;
  border:1px solid var(--st-needs_number-tint);background:var(--st-needs_number-tint);
  color:var(--st-needs_number-ink);font:inherit;font-size:var(--fs-micro)}
.cand button[aria-pressed="true"]{background:var(--st-needs_number-mark);border-color:var(--st-needs_number-mark);color:#fff}
.numin{width:130px;font-family:var(--font-mono)}
.occ{color:var(--st-needs_number-ink);font-size:var(--fs-micro)}

/* 扫描目录选择工作台 (Deck) */
.scan-deck{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.deck-head{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.path-bar{display:flex;align-items:center;gap:var(--sp-2);flex:1 1 360px;background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:var(--r-2);padding:var(--sp-1) var(--sp-2);min-width:0;flex-wrap:wrap}
.path-mount{font-size:11px;color:var(--text-3);background:var(--surface-3);
  padding:2px 8px;border-radius:var(--r-1);white-space:nowrap;font-weight:600}
.crumb-nav{display:flex;align-items:center;gap:2px;font-size:var(--fs-body);flex-wrap:wrap;min-width:0}
.crumb-btn{background:transparent;border:0;color:var(--accent);font:inherit;font-weight:600;
  cursor:pointer;padding:2px 6px;border-radius:var(--r-1);font-family:var(--font-mono)}
.crumb-btn:hover{background:var(--accent-soft)}
.crumb-sep{color:var(--text-3);font-size:var(--fs-micro)}
.path-input-wrap{display:flex;align-items:center;gap:var(--sp-1);margin-inline-start:auto}
.path-in{width:160px;min-height:26px;font-size:var(--fs-micro);padding:0 var(--sp-2);background:var(--surface);border-color:var(--line)}
.deck-actions{display:flex;align-items:center;gap:var(--sp-2)}
.presets-row{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;padding-block:var(--sp-2);
  border-block:1px dashed var(--line);font-size:var(--fs-micro)}
.deck-lbl{color:var(--text-3);font-size:var(--fs-micro);font-weight:600;white-space:nowrap}
.preset-chips{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.preset-btn{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 var(--sp-3);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);
  color:var(--text-2);font:inherit;font-size:var(--fs-micro);cursor:pointer;transition:all var(--dur-fast) var(--ease-out)}
.preset-btn:hover{background:var(--surface-3);color:var(--text);border-color:var(--line-strong)}
.preset-btn.active{background:var(--accent-soft);color:var(--st-running-ink);border-color:var(--accent);font-weight:600}
.preset-path{color:var(--text-3);font-family:var(--font-mono);font-size:11px}
.inline-explorer{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-2);overflow:hidden}
.explorer-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--surface-3);border-block-end:1px solid var(--line);flex-wrap:wrap}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.dir-table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.dir-table th{background:var(--surface-3);font-size:var(--fs-micro);padding:var(--sp-2) var(--sp-3);
  border-block-end:1px solid var(--line);font-weight:600;color:var(--text-2);text-align:start}
.dir-table td{padding:var(--sp-2) var(--sp-3);border-block-end:1px solid var(--line);vertical-align:middle}
.dir-table tr:hover td{background:var(--surface-2)}
.dir-table tr.is-excluded td{background:var(--st-partial-tint)}
.dir-cell-name{display:inline-flex;align-items:center;gap:8px;min-width:0}
.dir-link-btn{background:transparent;border:0;color:var(--text);font:inherit;font-family:var(--font-mono);
  font-weight:600;font-size:var(--fs-body);cursor:pointer;padding:0;text-decoration:none}
.dir-link-btn:hover{color:var(--accent);text-decoration:underline}
.dir-acts-cell{display:inline-flex;align-items:center;gap:var(--sp-2);justify-content:flex-end}
.dir-icon{color:var(--accent);flex:0 0 auto}
.excluded-badge{font-size:10.5px;color:var(--st-partial-ink);background:var(--st-partial-tint);
  border:1px solid var(--st-partial-mark);padding:0 6px;border-radius:var(--r-1);font-weight:600}
.root-badge{font-size:10.5px;color:var(--st-running-ink);background:var(--accent-soft);
  border:1px solid var(--accent);padding:0 6px;border-radius:var(--r-1);font-weight:600}

/* 扫描范围与过滤清单 (双栏结构化规整排版) */
.scope-ledger{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);margin-block-start:var(--sp-2)}
@media (max-width:768px){ .scope-ledger{grid-template-columns:1fr} }
.scope-col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-2);padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
.scope-col-head{display:flex;align-items:center;justify-content:space-between;border-block-end:1px solid var(--line);padding-block-end:var(--sp-2)}
.scope-title{font-size:var(--fs-micro);font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.scope-items{display:flex;flex-direction:column;gap:6px}
.scope-item{display:flex;align-items:center;gap:var(--sp-2);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-1);padding:6px var(--sp-2);font-size:var(--fs-micro);box-shadow:var(--shadow-1)}
.scope-item.is-exclude{border-color:var(--st-partial-tint);background:var(--st-partial-tint)}
.scope-item .item-path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope-item .item-badge{font-size:10.5px;color:var(--text-2);background:var(--surface-3);padding:1px 6px;border-radius:var(--r-1);white-space:nowrap}
.scope-item .exclude-badge{color:var(--st-partial-ink);background:rgba(217,119,6,0.12);font-weight:600}
.scope-item .item-del{color:var(--text-3);padding:2px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.scope-item .item-del:hover{color:var(--st-failed-ink)}
.scope-item .item-lock{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.scope-empty{color:var(--text-3);font-size:var(--fs-micro);padding:var(--sp-2) 0;text-align:center}
.scope-footer{display:flex;align-items:center;gap:var(--sp-3);padding-block-start:var(--sp-2);border-block-start:1px solid var(--line);font-size:var(--fs-micro);flex-wrap:wrap}
.scope-stat{color:var(--text-2)}
.scope-stat b{color:var(--text)}

/* ============================================================
   6. 变体 B · 卡片墙
   ============================================================ */
.vB{background:var(--bg);color:var(--text);min-height:100vh}
.vB .top{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-6);
  background:var(--surface);border-block-end:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.vB .nav{display:flex;gap:2px;background:var(--surface-3);border-radius:var(--r-pill);padding:2px}
.vB .nav a{display:inline-flex;align-items:center;min-height:30px;padding:0 var(--sp-4);border-radius:var(--r-pill);
  color:var(--text-2);font-size:var(--fs-body)}
.vB .nav a[aria-current="page"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-1)}
.vB main{max-width:1400px;margin:0 auto;padding:var(--sp-6) var(--sp-6) 112px}
.vB .page-h{font-size:var(--fs-title);font-weight:700}
.vB .sub{color:var(--text-2);font-size:var(--fs-micro);margin-block-end:var(--sp-5)}
.vB .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--sp-5)}
.vB .tcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-4);
  overflow:hidden;color:inherit;box-shadow:var(--shadow-1);text-decoration:none;
  transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out)}
.vB .tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.vB .tcard .poster{width:100%;aspect-ratio:2/3}
.vB .tcard .meta{padding:var(--sp-3)}
.vB .tcard .num{font-family:var(--font-mono);font-weight:600;font-size:var(--fs-body);font-variant-numeric:tabular-nums}
.vB .tcard .ti{color:var(--text-2);font-size:var(--fs-micro);margin-block:var(--sp-1) var(--sp-2);min-height:34px}
.vB .tcard .foot{display:flex;align-items:center;justify-content:space-between;color:var(--text-3);font-size:var(--fs-micro)}
.vB .drop{border:2px dashed var(--line-strong);border-radius:var(--r-5);padding:var(--sp-6);text-align:center;
  background:var(--surface);margin-block-end:var(--sp-5)}
.vB .drop .big{font-size:var(--fs-lead);font-weight:600;margin-block-end:var(--sp-1)}
.vB .drop .hint{color:var(--text-2);font-size:var(--fs-micro);max-width:62ch;margin:0 auto}
.vB .roots{display:flex;gap:var(--sp-2);flex-wrap:wrap;justify-content:center;margin-block:var(--sp-4)}
.vB .candrow{display:flex;gap:var(--sp-4);align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-4);padding:var(--sp-3);margin-block-end:var(--sp-3);flex-wrap:wrap}
.vB .candrow .f16{width:200px;aspect-ratio:16/9;border-radius:var(--r-3);flex:0 0 auto}
.vB .candrow .info{flex:1;min-width:200px}
.vB .candrow .num{font-family:var(--font-mono);font-size:var(--fs-title);font-weight:700}
.vB .hero{position:relative;border-radius:var(--r-5);overflow:hidden;margin-block-end:var(--sp-4)}
.vB .hero .bg{width:100%;aspect-ratio:21/9;filter:saturate(.9)}
.vB .hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.8))}
.vB .hero .in{position:absolute;inset-inline:var(--sp-5);bottom:var(--sp-4);display:flex;gap:var(--sp-4);
  align-items:flex-end;color:#fff;flex-wrap:wrap}
.vB .hero .poster{width:104px;aspect-ratio:2/3;border-radius:var(--r-2);flex:0 0 auto;box-shadow:var(--shadow-2)}
.vB .hero h1{font-size:var(--fs-display);color:#fff}
.vB .hero .m{font-size:var(--fs-micro);opacity:.95;margin-block-start:var(--sp-1)}
.vB .cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:var(--sp-5)}
.vB .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-4);padding:var(--sp-4);
  box-shadow:var(--shadow-1)}
.vB .panel h2,.vB .panel h3{font-size:var(--fs-micro);color:var(--text-2);letter-spacing:.04em;margin-block-end:var(--sp-2)}
.vB .fld{display:flex;gap:var(--sp-3);padding:var(--sp-2) 0;border-block-end:1px solid var(--line);font-size:var(--fs-body)}
.vB .fld:last-child{border-block-end:0}
.vB .fld .k{width:104px;flex:0 0 auto;color:var(--text-2);font-family:var(--font-mono);font-size:var(--fs-micro)}
.vB .fld .v{flex:1;min-width:0}
.vB .fld .s{color:var(--text-3);font-size:var(--fs-micro)}
.vB .fld.miss .v{color:var(--st-failed-ink)}
.vB .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-2);margin-block-start:var(--sp-2)}

var _imgCache = {};
function svgURI(seed, w, h, label){
  var key = seed+'|'+w+'|'+h+'|'+label;

  if(shortLabel.length > 14) shortLabel = shortLabel.substring(0, 12) + '…';
  var s = '';
  if(isWide){
    var cropX = Math.round(w * 0.52);
    s = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
     + '<defs>'
     + '<linearGradient id="bg_'+seed+'_'+w+'" x1="0" y1="0" x2="1" y2="1">'
     + '<stop offset="0" stop-color="hsl('+hue+',35%,22%)"/>'

     + '</linearGradient>'
     + '<linearGradient id="front_'+seed+'_'+w+'" x1="0" y1="0" x2="1" y2="1">'
     + '<stop offset="0" stop-color="hsl('+hue+',48%,36%)"/>'

     + '<rect x="18" y="24" width="'+(cropX-36)+'" height="12" rx="2" fill="#ffffff" opacity="0.4"/>'
     + '<rect x="18" y="44" width="'+(cropX-56)+'" height="8" rx="2" fill="#ffffff" opacity="0.25"/>'
     + '<rect x="18" y="58" width="'+(cropX-80)+'" height="8" rx="2" fill="#ffffff" opacity="0.2"/>'
     + '<rect x="18" y="'+(h-64)+'" width="48" height="32" rx="3" fill="#ffffff" opacity="0.15"/>'
     + '<rect x="74" y="'+(h-64)+'" width="48" height="32" rx="3" fill="#ffffff" opacity="0.15"/>'
     + '</g>'

     + '<!-- 右侧：封面主体（后续裁剪为竖版 poster.jpg） -->'
     + '<rect x="'+cropX+'" y="0" width="'+(w-cropX)+'" height="'+h+'" fill="url(#front_'+seed+'_'+w+')"/>'
     + '<circle cx="'+(cropX+(w-cropX)*0.55)+'" cy="'+(h*0.38)+'" r="'+(h*0.28)+'" fill="hsl('+((hue+180)%360)+',65%,65%)" opacity="0.22"/>'
     + '<text x="'+(cropX+(w-cropX)*0.5)+'" y="22" text-anchor="middle" fill="#ffffff" opacity="0.75" font-size="10" font-family="sans-serif">✂ 竖版海报裁切区 (2:3)</text>'
     + '<text x="'+(cropX+(w-cropX)*0.5)+'" y="'+(h*0.56)+'" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="'+Math.round(h*0.12)+'" font-family="monospace">'+esc(shortLabel)+'</text>'
     + '<text x="'+(cropX+(w-cropX)*0.5)+'" y="'+(h*0.74)+'" text-anchor="middle" fill="#ffffff" opacity="0.8" font-size="11" font-family="sans-serif">横版完整封套 (fanart)</text>'
     + '</svg>';
  } else {
    s = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
     + '<defs>'
     + '<linearGradient id="p_'+seed+'_'+w+'" x1="0" y1="0" x2="1" y2="1">'
     + '<stop offset="0" stop-color="hsl('+hue+',48%,36%)"/>'
     + '<stop offset="1" stop-color="hsl('+((hue+35)%360)+',55%,18%)"/>'
     + '</linearGradient>'
     + '</defs>'
     + '<rect width="'+w+'" height="'+h+'" fill="url(#p_'+seed+'_'+w+')"/>'
     + '<circle cx="'+(w*0.55)+'" cy="'+(h*0.38)+'" r="'+(w*0.42)+'" fill="hsl('+((hue+180)%360)+',65%,65%)" opacity="0.22"/>'

       + '<span class="row" style="margin-inline-start:auto;flex-wrap:wrap">'
       + '<span class="cand">'+f.cands.map(function(c){
          return '<button type="button" aria-pressed="'+(S.nums[key]===c)+'" data-num="'+esc(key)+'|'+esc(c)+'">'+esc(c)+'</button>'}).join('')+'</span>'
       + '<label class="sr-only" for="cn-'+esc(key)+'">'+esc(f.p)+' 的番号</label>'
       + '<input id="cn-'+esc(key)+'" value="'+esc(S.nums[key]||'')+'" placeholder="番号" style="width:120px">'
       + '<label class="flabel"><input type="checkbox" '+(f.part?'checked':'')+' data-ispart="'+esc(key)+'"> 分片</label>'
       + '</span></div>';
    });
    h += '<div class="row" style="margin-block-start:var(--sp-3)"><span class="grow"></span>'
     + '<button class="btn" type="button">跳过（取消任务）</button>'
     + '<button class="btn btn-pri" type="button">提交并重跑</button></div></div>';
  });
  return h;
}

/* ============================================================
   目录选择器（容器内）与灯箱：对话框语义 + 焦点陷阱 + 焦点归还
   ============================================================ */
function pickHTML(){
  if(!S.picker.open) return '';
  var p = S.picker.path, dirs = FS[p] || [], segs = [], acc = '';
  p.split('/').filter(function(x){return x!==''}).forEach(function(x){
    acc += '/'+x;
    segs.push('<a href="#" data-pk="go" data-pk-path="'+esc(acc)+'">'+esc(x)+'</a>');
  });
  var h = '<div class="dlg" data-dlg="picker">'
   + '<div class="box" role="dialog" aria-modal="true" aria-labelledby="pk-title">'
   + '<h2 id="pk-title">选择目录 · '+(S.picker.mode==='exclude'?'加入排除':'加入待扫描目录')+'（容器内）</h2>'
   + '<nav class="crumb" aria-label="当前路径">'
   + '<a href="#" data-pk="mount" data-pk-path="'+esc(BROWSER_ROOTS[0].path)+'">'+esc(BROWSER_ROOTS[0].label)+'</a>'
   + '<span class="sep">/</span>'+segs.join('<span class="sep">/</span>')+'</nav>'
   + '<div class="jump"><label class="sr-only" for="pkpath">手输容器内路径</label>'
   + '<input id="pkpath" value="'+esc(p)+'" placeholder="/media/2024">'
   + '<button class="btn" type="button" data-pk="jump">前往</button></div>';
  if(S.picker.err) h += '<div class="notice notice-error err" role="alert">'+ICON.warn+'<span>'+esc(S.picker.err)+'</span></div>';
  h += '<div class="list">';
  if(p!==BROWSER_ROOTS[0].path) h += '<button class="item" type="button" data-pk="up">'+ICON.up
   + '<span class="n">..</span><span class="c">上一级</span></button>';
  if(!dirs.length) h += '<p class="item" style="cursor:default;color:var(--text-3)">（没有子目录）</p>';
  dirs.forEach(function(d){
    h += '<button class="item" type="button" data-pk="go" data-pk-path="'+esc(p+'/'+d[0])+'">'+ICON.folder
     + '<span class="n">'+esc(d[0])+'/</span><span class="c">'+esc(d[1])+'</span></button>';
  });
  h += '</div><div class="foot"><span class="path truncate">'+esc(p)+'</span>'
   + '<button class="btn" type="button" data-pk="close">取消</button>'
   + '<button class="btn" type="button" data-pk="apply" data-pk-mode="root">加入待扫描目录</button>'
   + '<button class="btn btn-pri" type="button" data-pk="apply" data-pk-mode="exclude">加入排除</button>'
   + '</div></div></div>';
  return h;
}
function lightboxHTML(){
  if(!S.lb) return '';
  return '<div role="dialog" aria-modal="true" aria-label="大图预览">'
   + '<img src="'+esc(S.lb.src)+'" alt="'+esc(S.lb.alt)+'">'
   + '<p class="cap">'+esc(S.lb.alt)+' · 点击任意处或按 Esc 关闭</p>'
   + '<button class="close" type="button" data-lb-close="1">'+ICON.close+'关闭</button></div>';
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  var app = document.getElementById('app');
  app.className = 'app v'+S.variant+(S.variant==='C'?' theme-dark':'');
  if(S.variant==='A') app.innerHTML = aShell(S.view);
  else if(S.variant==='B') app.innerHTML = bShell(S.view);
  else app.innerHTML = cShell(S.view);
  document.getElementById('lb').innerHTML = lightboxHTML();
  document.getElementById('bar').innerHTML = barHTML();
  app.insertAdjacentHTML('beforeend', pickHTML());
  focusFor();
}
function barHTML(){
  var v = VARIANTS.filter(function(x){return x[0]===S.variant})[0];
  return '<div class="inner" role="group" aria-label="原型控制条">'
   + '<span class="tag">调试模式</span>'
   + '<span class="seg"><button type="button" data-act="prev" aria-label="上一个设计变体">'+ICON.left+'</button>'
   + '<span class="lbl">'+v[0]+' · '+esc(v[1])+'</span>'
   + '<button type="button" data-act="next" aria-label="下一个设计变体">'+ICON.right+'</button></span>'
   + '<span class="sep"></span><span class="seg" role="group" aria-label="视图切换">'
   + VIEWS.map(function(x){
      return '<button type="button" data-view="'+x[0]+'" aria-pressed="'+(S.view===x[0])+'">'+esc(x[1])+'</button>'}).join('')
   + '</span><span class="sep"></span><span class="seg" role="group" aria-label="页面状态">'
   + STATES.map(function(x){
      return '<button type="button" data-state="'+x[0]+'" aria-pressed="'+(S.state===x[0])+'">'+esc(x[1])+'</button>'}).join('')
   + '</span><span class="sep"></span><span class="seg" role="group" aria-label="样本数据">'
   + DETAIL_SAMPLES.map(function(n){
      return '<button type="button" data-detail="'+esc(n)+'" aria-pressed="'+(S.detail===n)+'">'+esc(n)+'</button>'}).join('')
   + '</span></div>';
}
/* 焦点：对话框打开时把焦点送进去，关闭时还给打开它的那个按钮 */
function focusFor(){
  var dlg = document.querySelector('.dlg .box') || document.querySelector('#lb [role=dialog]');
  if(dlg){
    var first = dlg.querySelector('input,button,select,a[href]');
    if(first && !dlg.contains(document.activeElement)) first.focus();
    return;
  }
  if(S.focusBack){
    var el = document.querySelector(S.focusBack);
    S.focusBack = null;
    if(el){ el.focus(); return; }
    var main = document.querySelector('main');   /* 原来的元素已不在（比如刚被移除的 chip）：退到主区域 */
    if(main) main.focus();
  }
}
function trapFocus(e){
  var box = document.querySelector('.dlg .box') || document.querySelector('#lb [role=dialog]');
  if(!box) return;
  var f = Array.prototype.filter.call(box.querySelectorAll('input,button,select,a[href],[tabindex]:not([tabindex="-1"])'),
    function(el){ return el.offsetParent !== null || el === document.activeElement; });
  if(!f.length) return;
  var first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function set(o){ for(var k in o) S[k] = o[k]; writeURL(); render(); }
/* 点击后重渲染：先把焦点目标记下来，渲染完再还回去 */
function rerender(el){
  if(el && !S.focusBack){
    var s = selectorFor(el);
    if(s) S.focusBack = s;
  }
  render();
}
function cycle(dir){
  var i = VARIANTS.map(function(x){return x[0]}).indexOf(S.variant);
  i = (i + dir + VARIANTS.length) % VARIANTS.length;
  set({variant:VARIANTS[i][0]});
}
function closePicker(){ S.picker.open = false; S.focusBack = '[data-pk-open="'+S.picker.mode+'"]'; render(); }
function closeLB(){ S.lb = null; render(); }

/* ============================================================
   交互
   ============================================================ */
document.addEventListener('click', function(e){
  var t = e.target;

  /* 灯箱：详情页里点图放大（图本身就是 button，键盘可达） */
  var zb = t.closest && t.closest('[data-zoom]');
  if(zb && !S.picker.open){
    var m = /url\(["']?(.*?)["']?\)/.exec(zb.style.backgroundImage||'');
    if(m){ S.lb = {src:m[1], alt:zb.dataset.zoom}; S.focusBack = selectorFor(zb); render(); }
    return;
  }
  if(t.id==='lb' || (t.closest && t.closest('[data-lb-close]'))){ closeLB(); return; }
  if(t.classList && t.classList.contains('dlg')){ closePicker(); return; }

  var el = t.closest && t.closest('[data-act],[data-view],[data-state],[data-detail],[data-tab],[data-num],'+
    '[data-g],[data-row],[data-pk],[data-pk-open],[data-chip],[data-clear-rows],[data-rerun],[data-copy],[data-ispart]');
  if(!el) return;

  /* 真链接（视图切换）：保留 href 语义，JS 可用时走内存状态 */
  if(el.dataset.view && el.tagName === 'A') e.preventDefault();

  if(el.dataset.act === 'prev') return cycle(-1);
  if(el.dataset.act === 'next') return cycle(1);
  if(el.dataset.act === 'set-preset'){
    var p = el.dataset.path;
    S.navDir = p;
    if(S.roots.indexOf(p) < 0) S.roots.push(p);
    rerender(el); return;
  }
  if(el.dataset.act === 'nav-dir'){
    S.navDir = el.dataset.path;
    rerender(el); return;
  }
  if(el.dataset.act === 'set-root' || el.dataset.act === 'toggle-root'){
    var p2 = el.dataset.path;
    var idx = S.roots.indexOf(p2);
    if(idx >= 0){
      if(S.roots.length > 1) S.roots.splice(idx, 1);
    } else {
      S.roots.push(p2);
    }
    rerender(el); return;
  }
  if(el.dataset.act === 'toggle-exclude'){
    var ep = el.dataset.path;
    var idx = S.excludes.indexOf(ep);
    if(idx >= 0) S.excludes.splice(idx, 1);
    else S.excludes.push(ep);
    rerender(el); return;
  }
  if(el.dataset.act === 'jump-nav-dir'){
    var inp = document.getElementById('scan-path-in');
    var v = ((inp && inp.value)||'').trim();
    if(v){
      S.navDir = v;
      S.roots = [v];
    }
    rerender(el); return;
  }
  if(el.dataset.act === 'toggle-explorer'){
    S.explorerOpen = !S.explorerOpen;
    rerender(el); return;
  }
  if(el.dataset.act === 'scan-run'){
    el.setAttribute('aria-live','polite');
    el.classList.add('pulse');
    setTimeout(function(){ el.classList.remove('pulse'); }, 900);
    return;
  }
  if(el.dataset.act === 'scan-all'){
    var allPicked = SCAN_GROUPS.length > 0 && SCAN_GROUPS.every(function(g, gi){ return !!S.picked[gi]; });
    if(allPicked) S.picked = {};
    else SCAN_GROUPS.forEach(function(g, gi){ S.picked[gi] = true; });
    rerender(el); return;
  }
  if(el.dataset.act === 'create-tasks' || el.dataset.act === 'batch-rerun' || el.dataset.act === 'cancel-task' || el.dataset.act === 'skip-cancel' || el.dataset.act === 'submit-rerun'){
    el.setAttribute('aria-live','polite');
    el.classList.add('pulse');
    setTimeout(function(){ el.classList.remove('pulse'); }, 900);
    return;
  }
  if(el.dataset.act === 'clear-filter'){
    set({state:'normal'}); return;
  }
  if(el.dataset.act === 'page-prev'){
    if(S.page > 1){ S.page--; rerender(el); }
    return;
  }
  if(el.dataset.act === 'page-next'){
    if(S.page < 7){ S.page++; rerender(el); }
    return;
  }
  if(el.dataset.act === 'page-num'){
    var p = parseInt(el.dataset.page, 10);
    if(p && p !== S.page){ S.page = p; rerender(el); }
    return;
  }
  if(el.dataset.view){
    var v = el.dataset.view;
    if(v==='detail' && S.view!=='detail') return set({view:'detail'});
    return set({view:v});
  }
  if(el.dataset.state) return set({state:el.dataset.state});
  if(el.dataset.detail && DETAILS[el.dataset.detail]) return set({detail:el.dataset.detail, view:'detail'});
  if(el.dataset.tab){ S.tab = el.dataset.tab; return rerender(el); }
  if(el.dataset.clearRows){ S.rows = {}; rerender(el); return; }
  if(el.dataset.rerun || el.dataset.copy){
    /* 原型：不真的发请求，只给一次反馈 */
    el.setAttribute('aria-live','polite');
    el.classList.add('pulse');
    setTimeout(function(){ el.classList.remove('pulse'); }, 900);
    return;
  }
  if(el.dataset.num){
    var q = el.dataset.num.split('|'), key = q[0]+'|'+q[1], val = q[2];
    S.nums[key] = (S.nums[key]===val ? '' : val);
    rerender(el); return;
  }
  if(el.dataset.ispart !== undefined && el.type === 'checkbox'){
    /* 分片勾选：原型只记录状态（真值由后端落 task_files.is_part） */
    return;
  }
  if(el.dataset.pkOpen){
    S.focusBack = '[data-pk-open="'+el.dataset.pkOpen+'"]';
    S.picker = {open:true, path:(S.roots[0]||BROWSER_ROOTS[0].path), mode:el.dataset.pkOpen, err:''};
    render(); return;
  }
  if(el.dataset.pk){
    var pk = el.dataset.pk;
    if(pk==='close') return closePicker();
    if(pk==='go' || pk==='mount'){ e.preventDefault(); S.picker.path = el.dataset.pkPath; S.picker.err=''; render(); return; }
    if(pk==='up'){
      var up = S.picker.path.replace(/\/[^\/]+\/?$/, '');
      S.picker.path = (up.length < BROWSER_ROOTS[0].path.length) ? BROWSER_ROOTS[0].path : up;
      S.picker.err=''; render(); return;
    }
    if(pk==='jump'){
      var inp = document.getElementById('pkpath');
      var val2 = ((inp && inp.value) || '').trim();
      S.picker.path = val2 || BROWSER_ROOTS[0].path;
      S.picker.err = mountOf(S.picker.path) ? ''
        : '不在可浏览根内（browse_roots: /media）—— 只允许 /media 及其子目录。改成 /media 下的路径，或先在 config.yaml 里加白名单。';
      render(); return;
    }
    if(pk==='apply'){
      var mode = el.dataset.pkMode, path = S.picker.path;
      if(!mountOf(path)){
        S.picker.err = '不在可浏览根内（browse_roots: /media）。';
        render(); return;
      }
      if(mode==='root'){
        if(S.roots.indexOf(path) < 0) S.roots.push(path);
      } else {
        var under = S.roots.some(function(r){ return path.indexOf(r+'/')===0; });
        if(!under){
          S.picker.err = '排除目录必须是某个根目录的真子目录（#10 的校验规则）。先把它上面的一级设为根目录。';
          render(); return;
        }
        if(S.excludes.indexOf(path) < 0) S.excludes.push(path);
      }
      closePicker(); return;
    }
  }
  if(el.dataset.chip){
    var kind = el.dataset.chip, cp = el.dataset.chipPath;
    if(kind==='root') S.roots = S.roots.filter(function(x){return x!==cp});
    else S.excludes = S.excludes.filter(function(x){return x!==cp});
    rerender(el); return;
  }
  if(el.dataset.g !== undefined && el.type === 'checkbox'){
    var g = el.dataset.g;
    if(S.picked[g]) delete S.picked[g]; else S.picked[g] = true;
    rerender(el); return;
  }
  if(el.dataset.row !== undefined && el.type === 'checkbox'){
    var r = el.dataset.row;
    if(S.rows[r]) delete S.rows[r]; else S.rows[r] = true;
    rerender(el); return;
  }
});
/* tablist 的键盘行为：左右箭头在标签间移动 */
document.addEventListener('keydown', function(e){
  var t = document.activeElement;
  var inField = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
  if(e.key==='Escape'){
    if(S.picker.open) return closePicker();
    if(S.lb) return closeLB();
    return;
  }
  if(e.key==='Tab'){ if(S.picker.open || S.lb) trapFocus(e); return; }
  if(inField) return;
  if(t && t.getAttribute && t.getAttribute('role')==='tab' && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
    var tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
    var i = tabs.indexOf(t);
    var n = (i + (e.key==='ArrowRight'?1:-1) + tabs.length) % tabs.length;
    tabs[n].focus(); tabs[n].click(); e.preventDefault(); return;
  }
  if(S.picker.open || S.lb) return;
  if(e.key==='ArrowLeft') cycle(-1);
  if(e.key==='ArrowRight') cycle(1);
});
readURL(); render();
</script>
