version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - unparam
    - unused
  settings:
    errcheck:
      # Writing to a caller-supplied io.Writer (the CLI's stdout, an HTTP
      # response) has nowhere to report a failure to; the caller owns the stream.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests may assert on error strings and may keep helpers that only one test
      # uses; the extra indirection is not worth it there.
      - path: _test\.go
        linters:
          - unparam
          - errorlint

formatters:
  enable:
    - gofmt
    - goimports
