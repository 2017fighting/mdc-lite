# One file = one complete pipeline. The id is the file name's stem (`main`), so
# there is no `id` key here; rename the file to rename the pipeline, and change its
# extension to disable it without deleting it.
#
# Every step's settings live under `with`. A step is `type` + `with` + optional
# `name` (required when the same type appears twice) + optional `on_error`
# (fail | continue, default fail).

name: main

steps:
  # Batch-level prefix: scan → filter → parse → group. These run once per trigger.
  - type: scan
    with:
      roots: ["/media"]
      exclude: []

  - type: filter
    with:
      # Ordered; the first rule that matches decides. The name is what shows up in
      # the step's skipped counts, so keep it meaningful.
      rules:
        - name: companions
          when: {ext_in: [".srt", ".ass", ".ssa", ".jpg", ".jpeg", ".png", ".webp"]}
          then: include
        - name: too-small
          when: {min_size: 104857600}
          then: exclude
        - name: videos
          when: {ext_in: [".mp4", ".mkv", ".avi", ".wmv", ".mov", ".m4v", ".ts", ".iso"]}
          then: include
        - name: everything-else
          when: {stem_matches: "^.*$"}
          then: exclude

  - type: parse
    with:
      # A positional rule list: `{builtin: default}` expands the built-in set
      # (FC2 / date-code / dmm content-id / generic) where it stands, so a user
      # pattern written above it is credited first — but a reading that sits
      # inside another rule's longer match still loses. A table that never says
      # `builtin` uses no built-in rules at all.
      rules:
        - {builtin: default}
      # Noise stripped off the file name before matching. A bare string is a
      # literal; `r:` makes it a Go regexp. Parse runs before group (ADR-0019),
      # so these tables live here: they decide what the number rules see.
      # sanitize: ["1080p", "r:[-_. ](?:x264|x265|h264|h265)$"]
      # User part markers: must match at the end, first capture group is the
      # part number.
      # part_patterns: ['(?i)(?:^|[-_. ])slice(\d)$']

  - type: group
    with:
      companion_extensions: [".srt", ".ass", ".ssa", ".jpg", ".jpeg", ".png", ".webp"]

  # Task-level suffix: scrape → images → nfo → output. These run once per group
  # (one group per number, ADR-0019), and a rerun starts here rather than
  # re-walking the directory.
  - type: scrape
    with:
      # The global source order. An entry is either a bare id or an object carrying
      # that source's per-source knobs (proxy / domains / rate / timeout), so a
      # source's settings stay next to its position:
      #
      #   - id: dmm
      #     timeout: 30s
      #     domains: ["dmm.co.jp", "dmm.com"]   # ordered; a failed one falls through
      #     rate: {requests_per_second: 1, burst: 2, cooldown: 5m}
      #
      # A domain is a bare host (reached over https) or a full URL, which is how a
      # captured-page replay takes over one source while every other line — the
      # selectors, the age-gate cookie, the image Referer — stays the real one.
      sources:
        - javdb
        - dmm
        - javbus
        - fc2
      # The per-field order, written out for all 14 fields. A listed field replaces
      # the global order completely (it is not padded with `sources`); an unlisted
      # field uses `sources`. Only sources that declare a field may be listed for
      # it — naming javbus under `poster`, say, refuses startup, because javbus has
      # no poster and the mistake would otherwise surface as a field that is always
      # missing.
      priority:
        title: [javdb, dmm, javbus, fc2]
        plot: [javdb, dmm, fc2]
        fanart: [javdb, dmm, javbus, fc2]
        extrafanarts: [javdb, dmm, fc2]
        tags: [javdb, dmm, javbus, fc2]
        releasedate: [javdb, dmm, javbus, fc2]
        actors: [javdb, dmm, javbus]
        poster: [javdb, dmm]
        director: [javdb, dmm, javbus]
        runtime: [javdb, dmm, javbus, fc2]
        rating: [javdb, dmm]
        series: [javdb, dmm, javbus]
        studio: [javdb, dmm, javbus, fc2]
        publisher: [javdb, dmm, javbus]
      timeout: 5m

  - type: images
    with: {}

  - type: nfo
    with:
      template: default

  - type: output
    with:
      root: "/media/library"
      dir_template: "{{ number }}"
      file_template: "{{ number }}-cd{{ part }}"
      link: hardlink
      required_fields: ["title", "fanart"]
